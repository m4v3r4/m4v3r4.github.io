<header class="site-header">
  <div class="shell header-inner">
    <a class="site-brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} ana sayfa">
      <span class="brand-prompt" aria-hidden="true">~/</span>
      <span>{{ site.Title | lower | replaceRE "\\s+" "-" }}</span>
      <span class="brand-cursor" aria-hidden="true"></span>
    </a>

    <div class="header-actions">
      <nav class="site-nav" aria-label="Ana menü">
        {{ range site.Menus.main }}
          <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}><span aria-hidden="true">./</span>{{ .Name | lower }}</a>
        {{ end }}
      </nav>

      <button class="search-trigger" type="button" aria-label="Yazılarda ara" title="Yazılarda ara (/)" data-search-open>
        <span aria-hidden="true">⌕</span><span class="search-label">ara</span><kbd>/</kbd>
      </button>
      <button class="theme-toggle" type="button" aria-label="Renk temasını değiştir" title="Renk temasını değiştir">
        <span aria-hidden="true">◑</span>
      </button>
    </div>
  </div>
</header>
